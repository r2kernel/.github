<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" fill="none" role="img" aria-labelledby="title description">
<title id="title">R2Kernel: The runtime kernel for software-defined robots.</title>
<desc id="description">Robot = Platform + Application + Deployment. Platform describes what the robot can do. Application describes its tasks. Deployment sets the packages, hosts and links. R2Kernel checks, runs, connects and monitors the robot software.</desc>
